<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Luật Lao Động 2019</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <div id="tab-dashboard" class="space-y-6">
            <div class="bg-gradient-to-r from-red-100 to-rose-50 p-6 rounded-2xl border border-red-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-2xl font-black text-red-700">Bộ Luật Lao Động 2019</h2>
                    <p class="text-sm text-slate-600 mt-1">Hệ thống Flashcard & Trắc nghiệm chuyên sâu</p>
                </div>
                
                <div class="flex flex-col gap-2 min-w-[150px]">
                    <button onclick="syncData()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate"></i> Đồng bộ
                    </button>
                    <button onclick="clearData()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash"></i> Xóa dữ liệu
                    </button>
                </div>
            </div>

            <div id="chapters-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-center w-full col-span-3 py-10 text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu từ data.json...</p>
            </div>
        </div>
    </main>

    <script>
        let laborLawData = [];

        async function fetchQuestions() {
            try {
                const response = await fetch('data.json'); 
                if (!response.ok) throw new Error("Không tìm thấy file");
                laborLawData = await response.json();
                renderDashboard();
            } catch (error) {
                document.getElementById('chapters-grid').innerHTML = '<p class="text-red-500 w-full text-center py-10 font-medium">Lỗi tải dữ liệu. Hãy đảm bảo bạn đã để file data.json cùng thư mục với file index.html.</p>';
            }
        }

        function renderDashboard() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';
            laborLawData.forEach(ch => {
                const cardCount = ch.cards ? ch.cards.length : 0;
                const quizCount = ch.quiz ? ch.quiz.length : 0;
                
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-red-100 text-red-600 rounded-lg">Chương ${ch.id}</span>
                            <h4 class="font-bold text-base mt-3 text-slate-800">${ch.title}</h4>
                        </div>
                        <div class="flex gap-2 pt-4 mt-2 border-t border-slate-100">
                            <button class="flex-1 py-2 bg-slate-50 hover:bg-red-500 hover:text-white border border-slate-100 rounded-xl text-xs font-semibold transition text-slate-600">Flashcard (${cardCount})</button>
                            <button class="flex-1 py-2 bg-slate-50 hover:bg-red-500 hover:text-white border border-slate-100 rounded-xl text-xs font-semibold transition text-slate-600">Trắc nghiệm (${quizCount})</button>
                        </div>
                    </div>
                `;
            });
        }

        function syncData() {
            alert("Đang đồng bộ tiến độ học lên Cloud...");
        }

        function clearData() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ tiến độ, danh sách sao và câu sai không?")) {
                localStorage.clear();
                alert("Đã xóa toàn bộ dữ liệu máy khách!");
                location.reload();
            }
        }

        window.onload = fetchQuestions;
    </script>
</body>
</html>
