<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Luật Lao Động 2019 - Gamification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#ef4444', DEFAULT: '#dc2626', dark: '#b91c1c' },
                        pastelRed: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 500: '#ef4444' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-50 border-b border-red-100 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="bg-pastelRed-100 dark:bg-red-900/40 p-2.5 rounded-xl text-primary-light">
                    <i class="fa-solid fa-scale-balanced text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Luật Lao Động 2019</h1>
                    <span class="text-xs text-slate-500 dark:text-slate-400">Flashcard & Trắc nghiệm chuyên sâu</span>
                </div>
            </div>
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-red-50 dark:hover:bg-slate-600 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- TAB: DASHBOARD -->
        <div id="tab-dashboard" class="space-y-6">
            <div class="bg-gradient-to-r from-pastelRed-100 to-rose-50 dark:from-slate-800 dark:to-red-950/30 p-6 rounded-2xl border border-red-200 dark:border-red-900/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-black text-primary-dark dark:text-red-400">Chinh Phục 12 Chương</h2>
                    <div class="flex gap-2 mt-3">
                        <button onclick="openSavedList()" class="px-3 py-1.5 bg-amber-500 text-white rounded-xl text-sm font-semibold"><i class="fa-solid fa-star"></i> Đã Lưu (<span id="count-saved">0</span>)</button>
                        <button onclick="openWrongList()" class="px-3 py-1.5 bg-rose-500 text-white rounded-xl text-sm font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> Hay Sai (<span id="count-wrong">0</span>)</button>
                    </div>
                </div>
                
                <div class="flex flex-col gap-2 min-w-[150px] w-full md:w-auto">
                    <button onclick="syncData()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-sm font-semibold shadow-sm transition"><i class="fa-solid fa-rotate"></i> Đồng bộ</button>
                    <button onclick="clearData()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-sm font-semibold shadow-sm transition"><i class="fa-solid fa-trash"></i> Xóa dữ liệu</button>
                </div>
            </div>

            <div id="chapters-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-center w-full col-span-3 py-10 text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</p>
            </div>
        </div>

        <!-- TAB: STUDY -->
        <div id="tab-study" class="hidden space-y-6 max-w-2xl mx-auto">
            <div class="flex items-center justify-between">
                <button onclick="switchTab('dashboard')" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-medium"><i class="fa-solid fa-arrow-left"></i> Quay lại</button>
                <h3 id="study-title" class="font-bold text-lg text-primary-dark dark:text-red-400">Chương...</h3>
                <div class="flex gap-2">
                    <button onclick="setStudyMode('flashcard')" id="btn-mode-fc" class="px-3 py-1.5 rounded-xl text-sm font-semibold bg-primary-light text-white">Flashcard</button>
                    <button onclick="setStudyMode('quiz')" id="btn-mode-qz" class="px-3 py-1.5 rounded-xl text-sm font-semibold bg-slate-200 dark:bg-slate-700">Quiz</button>
                </div>
            </div>

            <!-- Flashcard -->
            <div id="flashcard-container" class="space-y-4">
                <div class="perspective-1000 w-full h-80 cursor-pointer" onclick="flipCard()">
                    <div id="card-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-2xl">
                        <div class="absolute inset-0 w-full h-full bg-white dark:bg-slate-800 p-6 rounded-2xl border border-red-100 dark:border-slate-700 flex flex-col justify-between backface-hidden">
                            <div class="flex justify-between text-xs text-slate-400"><span id="fc-index"></span><i class="fa-solid fa-rotate"></i></div>
                            <h4 id="fc-front" class="text-xl font-bold text-center"></h4>
                            <div class="text-center text-xs text-slate-400">Nhấn lật</div>
                        </div>
                        <div class="absolute inset-0 w-full h-full bg-rose-50 dark:bg-slate-800/90 p-6 rounded-2xl border border-red-200 dark:border-red-900/50 flex flex-col justify-between backface-hidden rotate-y-180">
                            <div class="text-xs text-primary-light">Giải thích</div>
                            <p id="fc-back" class="text-base overflow-y-auto max-h-44 text-center my-auto"></p>
                            <div class="text-center text-xs text-slate-400">Nhấn lật</div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button onclick="prevCard()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-medium"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="toggleSaveCurrentCard()" id="btn-save-fc" class="px-4 py-2 rounded-xl font-medium flex items-center gap-2"><i class="fa-regular fa-star" id="star-icon-fc"></i> Lưu thẻ</button>
                    <button onclick="nextCard()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-medium"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- Quiz -->
            <div id="quiz-container" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm space-y-4 border border-slate-200 dark:border-slate-700">
                    <div class="flex justify-between text-xs font-semibold text-slate-400">
                        <span id="quiz-progress"></span><span id="quiz-score" class="text-primary-light"></span>
                    </div>
                    <h4 id="quiz-question" class="text-lg font-bold"></h4>
                    <div id="quiz-options" class="space-y-3"></div>
                    <div id="quiz-explanation" class="hidden mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm">
                        <p class="font-bold text-primary-dark dark:text-red-400">Giải thích:</p>
                        <p id="quiz-explanation-text" class="mt-1"></p>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button onclick="prevQuiz()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-medium">Câu trước</button>
                    <button onclick="nextQuiz()" id="btn-next-quiz" class="hidden px-4 py-2 bg-primary-light text-white rounded-xl font-medium">Câu tiếp</button>
                </div>
            </div>
        </div>

        <!-- TAB: LIST -->
        <div id="tab-list-view" class="hidden space-y-4 max-w-2xl mx-auto">
            <button onclick="switchTab('dashboard')" class="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-medium"><i class="fa-solid fa-arrow-left"></i> Quay lại</button>
            <h3 id="list-view-title" class="font-bold text-lg">Danh sách</h3>
            <div id="list-container" class="space-y-3"></div>
        </div>
    </main>

    <script>
        let laborLawData = [];
        let savedItems = JSON.parse(localStorage.getItem('labor_law_saved')) || [];
        let wrongItems = JSON.parse(localStorage.getItem('labor_law_wrong')) || [];
        let currentChapterId = null, currentStudyMode = 'flashcard';
        let currentCardIndex = 0, currentQuizIndex = 0, quizScore = 0, selectedAnswersMap = {};

        async function fetchQuestions() {
            try {
                const response = await fetch('data.json'); 
                if (!response.ok) throw new Error("File not found");
                laborLawData = await response.json();
                renderDashboard();
            } catch (error) {
                document.getElementById('chapters-grid').innerHTML = '<p class="text-red-500 w-full text-center py-10 font-medium">Lỗi tải dữ liệu. Hãy chắc chắn file data.json nằm đúng thư mục.</p>';
            }
        }

        window.onload = function() {
            fetchQuestions();
            updateCounts();
            initTheme();
        };

        function switchTab(tabName) {
            ['tab-dashboard', 'tab-study', 'tab-list-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(`tab-${tabName === 'list' ? 'list-view' : tabName}`).classList.remove('hidden');
        }

        function renderDashboard() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';
            laborLawData.forEach(ch => {
                const cardCount = ch.cards ? ch.cards.length : 0;
                const quizCount = ch.quiz ? ch.quiz.length : 0;
                grid.innerHTML += `
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <span class="text-xs font-semibold px-2 py-1 bg-red-100 text-red-600 rounded-lg">Chương ${ch.id}</span>
                            <h4 class="font-bold text-base mt-2">${ch.title}</h4>
                            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${ch.description || ''}</p>
                        </div>
                        <div class="flex gap-2 pt-4 border-t border-slate-100 dark:border-slate-700 mt-3">
                            <button onclick="startChapter(${ch.id}, 'flashcard')" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-primary-light hover:text-white rounded-xl text-xs font-semibold transition">Flashcard (${cardCount})</button>
                            <button onclick="startChapter(${ch.id}, 'quiz')" class="flex-1 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-primary-light hover:text-white rounded-xl text-xs font-semibold transition">Quiz (${quizCount})</button>
                        </div>
                    </div>
                `;
            });
        }

        function startChapter(chapterId, mode) {
            currentChapterId = chapterId;
            currentCardIndex = 0; currentQuizIndex = 0; quizScore = 0; selectedAnswersMap = {};
            document.getElementById('study-title').innerText = laborLawData.find(c => c.id === chapterId).title;
            switchTab('study');
            setStudyMode(mode);
        }

        function setStudyMode(mode) {
            currentStudyMode = mode;
            document.getElementById('flashcard-container').classList.toggle('hidden', mode !== 'flashcard');
            document.getElementById('quiz-container').classList.toggle('hidden', mode !== 'quiz');
            document.getElementById('btn-mode-fc').className = `px-3 py-1.5 rounded-xl text-sm font-semibold ${mode === 'flashcard' ? 'bg-primary-light text-white' : 'bg-slate-200 dark:bg-slate-700'}`;
            document.getElementById('btn-mode-qz').className = `px-3 py-1.5 rounded-xl text-sm font-semibold ${mode === 'quiz' ? 'bg-primary-light text-white' : 'bg-slate-200 dark:bg-slate-700'}`;
            mode === 'flashcard' ? renderFlashcard() : renderQuiz();
        }

        function renderFlashcard() {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            if(!chapter || !chapter.cards || !chapter.cards[currentCardIndex]) return;
            const card = chapter.cards[currentCardIndex];
            document.getElementById('fc-index').innerText = `Thẻ ${currentCardIndex + 1}/${chapter.cards.length}`;
            document.getElementById('fc-front').innerText = card.q;
            document.getElementById('fc-back').innerText = card.a;
            document.getElementById('card-inner').classList.remove('rotate-y-180');
            updateSaveButton(card.q);
        }

        function flipCard() { document.getElementById('card-inner').classList.toggle('rotate-y-180'); }
        function nextCard() { const ch = laborLawData.find(c => c.id === currentChapterId); currentCardIndex = (currentCardIndex + 1) % ch.cards.length; renderFlashcard(); }
        function prevCard() { const ch = laborLawData.find(c => c.id === currentChapterId); currentCardIndex = (currentCardIndex - 1 + ch.cards.length) % ch.cards.length; renderFlashcard(); }

        function renderQuiz() {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            if(!chapter || !chapter.quiz || !chapter.quiz[currentQuizIndex]) return;
            const q = chapter.quiz[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `Câu ${currentQuizIndex + 1}/${chapter.quiz.length}`;
            document.getElementById('quiz-score').innerText = `Điểm: ${quizScore}`;
            document.getElementById('quiz-question').innerText = q.q;
            
            const optionsEl = document.getElementById('quiz-options');
            optionsEl.innerHTML = '';
            const ans = selectedAnswersMap[currentQuizIndex];

            q.options.forEach((opt, idx) => {
                let btnClass = "w-full text-left p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm";
                if (ans !== undefined) {
                    if (idx === q.correct) btnClass = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-50 text-green-700 text-sm";
                    else if (idx === ans) btnClass = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-50 text-red-700 text-sm";
                }
                optionsEl.innerHTML += `<button onclick="selectAnswer(${idx})" ${ans !== undefined ? 'disabled' : ''} class="${btnClass}"><span>${String.fromCharCode(65 + idx)}. ${opt}</span></button>`;
            });

            const exp = document.getElementById('quiz-explanation');
            if (ans !== undefined) {
                exp.classList.remove('hidden');
                document.getElementById('quiz-explanation-text').innerText = q.explanation || "Không có giải thích chi tiết.";
                document.getElementById('btn-next-quiz').classList.toggle('hidden', currentQuizIndex >= chapter.quiz.length - 1);
            } else {
                exp.classList.add('hidden');
                document.getElementById('btn-next-quiz').classList.add('hidden');
            }
        }

        function selectAnswer(idx) {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            const q = chapter.quiz[currentQuizIndex];
            selectedAnswersMap[currentQuizIndex] = idx;
            if (idx === q.correct) {
                quizScore += 10;
                setTimeout(nextQuiz, 1200);
            } else {
                addWrongItem({ chapter: chapter.title, q: q.q, explanation: q.explanation });
            }
            renderQuiz();
        }

        function nextQuiz() { const ch = laborLawData.find(c => c.id === currentChapterId); if (currentQuizIndex < ch.quiz.length - 1) { currentQuizIndex++; renderQuiz(); } }
        function prevQuiz() { if (currentQuizIndex > 0) { currentQuizIndex--; renderQuiz(); } }

        function toggleSaveCurrentCard() {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            const card = chapter.cards[currentCardIndex];
            const index = savedItems.findIndex(i => i.q === card.q);
            if (index > -1) savedItems.splice(index, 1);
            else savedItems.push({ chapter: chapter.title, q: card.q, a: card.a });
            localStorage.setItem('labor_law_saved', JSON.stringify(savedItems));
            updateCounts(); updateSaveButton(card.q);
        }

        function updateSaveButton(qText) {
            const isSaved = savedItems.some(i => i.q === qText);
            document.getElementById('star-icon-fc').className = isSaved ? "fa-solid fa-star text-amber-500" : "fa-regular fa-star";
            document.getElementById('btn-save-fc').className = isSaved ? "px-4 py-2 bg-amber-100 text-amber-700 rounded-xl font-medium flex items-center gap-2" : "px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-medium flex items-center gap-2";
        }

        function addWrongItem(obj) {
            if (!wrongItems.some(i => i.q === obj.q)) {
                wrongItems.push(obj);
                localStorage.setItem('labor_law_wrong', JSON.stringify(wrongItems));
                updateCounts();
            }
        }

        function updateCounts() {
            document.getElementById('count-saved').innerText = savedItems.length;
            document.getElementById('count-wrong').innerText = wrongItems.length;
        }

        function openSavedList() {
            switchTab('list'); document.getElementById('list-view-title').innerText = "Thẻ Đã Lưu";
            document.getElementById('list-container').innerHTML = savedItems.map(i => `<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700"><div class="text-xs text-primary-light">${i.chapter}</div><h5 class="font-bold">${i.q}</h5><p class="text-sm mt-2">${i.a}</p></div>`).join('') || '<p>Trống</p>';
        }

        function openWrongList() {
            switchTab('list'); document.getElementById('list-view-title').innerText = "Câu Hay Sai";
            document.getElementById('list-container').innerHTML = wrongItems.map(i => `<div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700"><div class="text-xs text-rose-500">${i.chapter}</div><h5 class="font-bold">${i.q}</h5><p class="text-sm mt-2">Giải thích: ${i.explanation}</p></div>`).join('') || '<p>Trống</p>';
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun";
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        function syncData() { alert("Đang đồng bộ..."); }
        function clearData() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ tiến độ?")) {
                localStorage.removeItem('labor_law_saved');
                localStorage.removeItem('labor_law_wrong');
                alert("Đã xóa dữ liệu!"); location.reload();
            }
        }
    </script>
</body>
</html>
