<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luật Lao Động 2019 - Gamification Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#ef4444', DEFAULT: '#dc2626', dark: '#b91c1c' },
                        pastelRed: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 500: '#ef4444' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 shadow-sm sticky top-0 z-50 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="bg-red-900/40 p-2.5 rounded-xl text-red-500">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Luật Lao Động 2019</h1>
                    <span id="user-xp" class="text-xs text-amber-400 font-semibold">🔥 Cấp độ: Tập sự (0 XP)</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="startArcadeGame()" class="px-3 py-1.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt"></i> Vượt Ải Pháp Lý
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <!-- TAB: DASHBOARD -->
        <div id="tab-dashboard" class="space-y-6">
            <div class="bg-gradient-to-r from-slate-800 to-red-950/40 p-6 rounded-2xl border border-red-900/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-black text-red-400">Bản Đồ 12 Chương Luật</h2>
                    <p class="text-sm text-slate-300 mt-1">Lựa chọn chương để học thẻ nhớ, luyện trắc nghiệm hoặc tích lũy điểm kinh nghiệm.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="openSavedList()" class="px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-semibold"><i class="fa-solid fa-star"></i> Đã Lưu (<span id="count-saved">0</span>)</button>
                    <button onclick="openWrongList()" class="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold"><i class="fa-solid fa-triangle-exclamation"></i> Hay Sai (<span id="count-wrong">0</span>)</button>
                </div>
            </div>

            <div id="chapters-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- TAB: STUDY -->
        <div id="tab-study" class="hidden space-y-6 max-w-2xl mx-auto">
            <div class="flex items-center justify-between">
                <button onclick="switchTab('dashboard')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium"><i class="fa-solid fa-arrow-left"></i> Thoát</button>
                <h3 id="study-title" class="font-bold text-lg text-red-400">Chương...</h3>
                <div class="flex gap-2" id="study-mode-buttons">
                    <button onclick="setStudyMode('flashcard')" id="btn-mode-fc" class="px-3 py-1.5 rounded-xl text-sm font-semibold bg-red-600 text-white">Thẻ Nhớ</button>
                    <button onclick="setStudyMode('quiz')" id="btn-mode-qz" class="px-3 py-1.5 rounded-xl text-sm font-semibold bg-slate-700">Trắc Nghiệm</button>
                </div>
            </div>

            <!-- Flashcard -->
            <div id="flashcard-container" class="space-y-4">
                <div class="perspective-1000 w-full h-80 cursor-pointer" onclick="flipCard()">
                    <div id="card-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-2xl">
                        <div class="absolute inset-0 w-full h-full bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col justify-between backface-hidden">
                            <div class="flex justify-between text-xs text-slate-400"><span id="fc-index"></span><i class="fa-solid fa-rotate"></i></div>
                            <h4 id="fc-front" class="text-xl font-bold text-center my-auto"></h4>
                            <div class="text-center text-xs text-slate-400">Chạm để lật thẻ</div>
                        </div>
                        <div class="absolute inset-0 w-full h-full bg-red-950/80 p-6 rounded-2xl border border-red-900 flex flex-col justify-between backface-hidden rotate-y-180">
                            <div class="text-xs text-red-400">Đáp án / Giải thích điều luật</div>
                            <p id="fc-back" class="text-base overflow-y-auto max-h-44 text-center my-auto"></p>
                            <div class="text-center text-xs text-slate-400">Chạm để lật lại</div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button onclick="prevCard()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium"><i class="fa-solid fa-chevron-left"></i> Trước</button>
                    <button onclick="toggleSaveCurrentCard()" id="btn-save-fc" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium flex items-center gap-2"><i class="fa-regular fa-star" id="star-icon-fc"></i> Lưu thẻ</button>
                    <button onclick="nextCard()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium">Sau <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- Quiz & Game Mode -->
            <div id="quiz-container" class="hidden space-y-4">
                <div id="game-card-wrapper" class="bg-slate-800 p-6 rounded-2xl shadow-lg space-y-4 border border-slate-700 transition-all">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-400">
                        <span id="quiz-progress"></span>
                        <span id="timer-box" class="text-amber-400 bg-amber-950/50 px-2.5 py-1 rounded-lg hidden"><i class="fa-solid fa-clock"></i> <span id="time-left">15</span>s</span>
                        <span id="quiz-score" class="text-red-400">Điểm: 0</span>
                    </div>
                    <h4 id="quiz-question" class="text-lg font-bold"></h4>
                    <div id="quiz-options" class="space-y-3"></div>
                    <div id="quiz-explanation" class="hidden mt-4 p-4 rounded-xl bg-slate-900 text-sm border border-slate-700">
                        <p class="font-bold text-red-400">Giải thích chi tiết:</p>
                        <p id="quiz-explanation-text" class="mt-1 text-slate-300"></p>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button onclick="prevQuiz()" class="px-4 py-2 bg-slate-700 rounded-xl font-medium">Câu trước</button>
                    <button onclick="nextQuiz()" id="btn-next-quiz" class="hidden px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium">Câu tiếp <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- TAB: LIST (Saved & Wrong) -->
        <div id="tab-list-view" class="hidden space-y-4 max-w-2xl mx-auto">
            <button onclick="switchTab('dashboard')" class="px-3 py-1.5 bg-slate-700 rounded-xl text-sm font-medium"><i class="fa-solid fa-arrow-left"></i> Quay lại</button> ngân hàng
            <h3 id="list-view-title" class="font-bold text-lg">Danh sách</h3>
            <div id="list-container" class="space-y-3"></div>
        </div>
    </main>

    <script>
        // Ngân hàng câu hỏi chuẩn hóa toàn bộ 12 chương Bộ luật Lao động 2019
        let laborLawData = [
            {
                id: 1, title: "Chương I: Những quy định chung", description: "Phạm vi điều chỉnh, đối tượng áp dụng, quyền và nghĩa vụ.",
                cards: [
                    { q: "Bộ luật Lao động 2019 áp dụng cho đối tượng nào?", a: "Áp dụng cho người lao động, người học nghề, tập nghề, NSDLĐ và người LĐ nước ngoài làm việc tại VN." },
                    { q: "Độ tuổi lao động tối thiểu của người lao động là bao nhiêu?", a: "Đủ 15 tuổi, trừ trường hợp quy định tại Mục 1 Chương XI." },
                    { q: "Thế nào là hành vi cưỡng bức lao động?", a: "Là việc dùng vũ lực, đe dọa dùng vũ lực hoặc thủ đoạn khác để ép buộc NLĐ làm việc trái ý muốn." }
                ],
                quiz: [
                    { q: "Bộ luật Lao động 2019 chính thức có hiệu lực thi hành từ ngày tháng năm nào?", options: ["01/01/2020", "01/01/2021", "20/11/2019", "01/07/2020"], correct: 1, explanation: "Căn cứ Điều 221 BLLĐ 2019, bộ luật có hiệu lực thi hành từ ngày 01/01/2021." },
                    { q: "Theo BLLĐ 2019, người lao động là người từ đủ bao nhiêu tuổi trở lên?", options: ["Đủ 15 tuổi", "Đủ 16 tuổi", "Đủ 18 tuổi", "Từ đủ 13 tuổi"], correct: 0, explanation: "Căn cứ Khoản 1 Điều 3 BLLĐ 2019, NLĐ là người từ đủ 15 tuổi trở lên, có năng lực hành vi dân sự." }
                ]
            },
            {

                    { q: "Việc làm được định nghĩa thế nào?", a: "Là hoạt động lao động tạo ra thu nhập mà pháp luật không cấm." },
                    { q: "Người lao động khi tham gia tuyển dụng có phải trả chi phí không?", a: "Người lao động tuyệt đối không phải trả chi phí cho việc tuyển dụng lao động." }
                ],
                quiz: [
                    { q: "Người sử dụng lao động phải khai trình việc sử dụng lao động trong thời hạn bao lâu?", options: ["15 ngày", "30 ngày", "45 ngày", "60 ngày"], correct: 1, explanation: "Căn cứ Khoản 2 Điều 12, NSDLĐ phải khai trình sử dụng lao động trong thời hạn 30 ngày kể từ ngày hoạt động." }
                ]
            },
            {
                id: 3, title: "Chương III: Hợp đồng lao động", description: "Giao kết, thực hiện, chấm dứt hợp đồng lao động.",
                cards: [
                    { q: "Hợp đồng xác định thời hạn có thời hạn tối đa bao nhiêu tháng?", a: "Không quá 36 tháng." },
                    { q: "Thời gian thử việc tối đa đối với công việc quản lý doanh nghiệp là bao lâu?", a: "Không quá 180 ngày." }

                    { q: "Tiền lương trong thời gian thử việc ít nhất phải bằng bao nhiêu phần trăm lương chính?", options: ["70%", "80%", "85%", "100%"], correct: 2, explanation: "Căn cứ Điều 26, tiền lương thử việc ít nhất bằng 85% mức lương của công việc đó." }

                cards: [ { q: "Thời hạn tập nghề tối đa để làm việc cho NSDLĐ là bao lâu?", a: "Không quá 03 tháng." } ],

                cards: [ { q: "Đối thoại định kỳ tại nơi làm việc diễn ra ít nhất mấy lần trong năm?", a: "Ít nhất 01 năm một lần." } ],

            },

                ],
                quiz: [
                    { q: "Làm thêm giờ vào ngày nghỉ hằng tuần (Chủ nhật) được trả lương ít nhất bằng bao nhiêu phần trăm?", options: ["150%", "200%", "300%", "100%"], correct: 1, explanation: "Căn cứ Điểm b Khoản 1 Điều 98, làm thêm ngày nghỉ hằng tuần được trả ít nhất bằng 200%." }
                ]
            },
            {
                id: 7, title: "Chương VII: Thời giờ làm việc, nghỉ ngơi", description: "Làm thêm giờ, nghỉ hằng năm, nghỉ lễ tết.",
                cards: [ { q: "Giờ làm việc ban đêm được tính từ mấy giờ đến mấy giờ?", a: "Từ 22 giờ đến 06 giờ sáng hôm sau." } ],
                quiz: [ { q: "Số ngày nghỉ lễ Quốc khánh (2/9 dương lịch) hằng năm được nghỉ hưởng nguyên lương là bao nhiêu ngày?", options: ["01 ngày", "02 ngày", "03 ngày", "04 ngày"], correct: 1, explanation: "Căn cứ Điểm đ Khoản 1 Điều 112, nghỉ lễ Quốc khánh được nghỉ 02 ngày." } ]

            {

                cards: [ { q: "Thời hiệu xử lý kỷ luật lao động thông thường là bao lâu?", a: "Là 06 tháng kể từ ngày xảy ra hành vi vi phạm." } ],

            {

                cards: [ { q: "Người lao động có quyền từ chối làm việc khi nào?", a: "Khi có nguy cơ rõ ràng đe dọa trực tiếp đến tính mạng, sức khỏe." } ],
                quiz: [ { q: "Trách nhiệm đảm bảo an toàn, vệ sinh lao động tại nơi làm việc thuộc về ai?", options: ["Chỉ người lao động", "Người sử dụng lao động", "Công an", "Công đoàn"], correct: 1, explanation: "Căn cứ Điều 134, NSDLĐ chịu trách nhiệm thực hiện đầy đủ các giải pháp." } ]
            },
            {
                id: 10, title: "Chương X: Lao động nữ", description: "Thai sản, bình đẳng giới.",
                cards: [ { q: "Thời gian nghỉ thai sản của lao động nữ sinh con bình thường là bao lâu?", a: "Là 06 tháng." } ],
                quiz: [ { q: "Lao động nữ nuôi con dưới 12 tháng tuổi được nghỉ mỗi ngày ít nhất bao nhiêu phút?", options: ["30 phút", "45 phút", "60 phút", "120 phút"], correct: 2, explanation: "Căn cứ Khoản 4 Điều 137, lao động nữ được nghỉ mỗi ngày 60 phút." } ]
            },
            {
                id: 11, title: "Chương XI: Lao động chưa thành niên", description: "Quy định riêng cho lao động chưa thành niên, cao tuổi.",
                cards: [ { q: "Thời giờ làm việc của người chưa đủ 15 tuổi tối đa là mấy giờ trong một ngày?", a: "Không quá 04 giờ trong 01 ngày." } ],
                quiz: [ { q: "Người lao động cao tuổi có quyền gì về thời giờ làm việc?", options: ["Phải làm đủ 8 tiếng", "Được thỏa thuận rút ngắn thời giờ làm việc", "Không được làm ban ngày", "Phải nghỉ hưu"], correct: 1, explanation: "Căn cứ Khoản 2 Điều 148, NLĐ cao tuổi được thỏa thuận rút ngắn thời giờ làm việc." } ]
            },
            {
                id: 12, title: "Chương XII: Giải quyết tranh chấp", description: "Tranh chấp lao động, đình công.",
                cards: [ { q: "Đình công là gì theo BLLĐ 2019?", a: "Là sự ngừng việc tạm thời, tự nguyện và có tổ chức của người lao động." } ],
                quiz: [ { q: "Theo lộ trình Khoản 2 Điều 169, tuổi nghỉ hưu của nam đạt 62 tuổi vào năm nào?", options: ["2026", "2028", "2030", "2035"], correct: 1, explanation: "Căn cứ Khoản 2 Điều 169, tuổi nghỉ hưu của nam đạt 62 tuổi vào năm 2028." } ]
            }
        ];

        let savedItems = JSON.parse(localStorage.getItem('labor_law_saved')) || [];
        let wrongItems = JSON.parse(localStorage.getItem('labor_law_wrong')) || [];
        let userXP = parseInt(localStorage.getItem('labor_law_xp')) || 0;
        let currentChapterId = null, currentStudyMode = 'flashcard';
        let currentCardIndex = 0, currentQuizIndex = 0, quizScore = 0, selectedAnswersMap = {};
        let isArcadeMode = false, arcadeTimer = null, timeLeft = 15;

        window.onload = function() {
            updateXPDisplay();
            renderDashboard(); 
            updateCounts();
        };

        function updateXPDisplay() {
            let rank = "Tập sự";
            if(userXP >= 50) rank = "Cử nhân Luật";
            if(userXP >= 150) rank = "Luật Sư Tập Sự";
            if(userXP >= 300) rank = "Thẩm Phán Tối Cao";
            document.getElementById('user-xp').innerText = `🔥 Cấp độ: ${rank} (${userXP} XP)`;
            localStorage.setItem('labor_law_xp', userXP);
        }

        function switchTab(tabName) {
            if(arcadeTimer) clearInterval(arcadeTimer);
            ['tab-dashboard', 'tab-study', 'tab-list-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(`tab-${tabName === 'list' ? 'list-view' : tabName}`).classList.remove('hidden');
        }

        function renderDashboard() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';
            laborLawData.forEach(ch => {
                const cardCount = ch.cards ? ch.cards.length : 0;
                const quizCount = ch.quiz ? ch.quiz.length : 0;
                grid.innerHTML += `
                    <div class="bg-slate-800 p-5 rounded-2xl shadow-md border border-slate-700 flex flex-col justify-between hover:border-red-500/50 transition">
                        <div>
                            <span class="text-xs font-semibold px-2 py-1 bg-red-950 text-red-400 rounded-lg border border-red-900">Chương ${ch.id}</span>
                            <h4 class="font-bold text-base mt-2 text-slate-100">${ch.title}</h4>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${ch.description || ''}</p>
                        </div>
                        <div class="flex gap-2 pt-4 border-t border-slate-700/60 mt-4">
                            <button onclick="startChapter(${ch.id}, 'flashcard')" class="flex-1 py-2 bg-slate-700 hover:bg-red-600 hover:text-white rounded-xl text-xs font-semibold transition">Thẻ Nhớ (${cardCount})</button>
                            <button onclick="startChapter(${ch.id}, 'quiz')" class="flex-1 py-2 bg-slate-700 hover:bg-red-600 hover:text-white rounded-xl text-xs font-semibold transition">Trắc Nghiệm (${quizCount})</button>
                        </div>
                    </div>
                `;
            });
        }

        // CHẾ ĐỘ VƯỢT ẢI (ARCADE GAME) CỰC KỲ CUỐN HÚT
        function startArcadeGame() {
            let allQuiz = [];
            laborLawData.forEach(ch => { if(ch.quiz) allQuiz.push(...ch.quiz); });
            allQuiz.sort(() => Math.random() - 0.5);

            isArcadeMode = true;
            currentChapterId = 'arcade';
            window.arcadeData = { title: "🎮 Chế Độ Vượt Ải Pháp Lý (15s/câu)", quiz: allQuiz.slice(0, 15) };
            currentQuizIndex = 0; quizScore = 0; selectedAnswersMap = {};

            document.getElementById('study-title').innerText = window.arcadeData.title;
            document.getElementById('study-mode-buttons').classList.add('hidden');
            document.getElementById('timer-box').classList.remove('hidden');
            switchTab('study');
            document.getElementById('flashcard-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderArcadeQuiz();
        }

        function renderArcadeQuiz() {
            if(arcadeTimer) clearInterval(arcadeTimer);
            timeLeft = 15;
            document.getElementById('time-left').innerText = timeLeft;
            
            arcadeTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(arcadeTimer);
                    handleTimeOut();
                }
            }, 1000);

            const q = window.arcadeData.quiz[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `Ải ${currentQuizIndex + 1}/${window.arcadeData.quiz.length}`;
            document.getElementById('quiz-score').innerText = `Điểm: ${quizScore}`;
            document.getElementById('quiz-question').innerText = q.q;
            
            const optionsEl = document.getElementById('quiz-options');
            optionsEl.innerHTML = '';
            const ans = selectedAnswersMap[currentQuizIndex];

            q.options.forEach((opt, idx) => {
                let btnClass = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-sm transition";
                if (ans !== undefined) {
                    if (idx === q.correct) btnClass = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/60 text-green-300 text-sm";
                    else if (idx === ans) btnClass = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/60 text-red-300 text-sm";
                }
                optionsEl.innerHTML += `<button onclick="selectArcadeAnswer(${idx})" ${ans !== undefined ? 'disabled' : ''} class="${btnClass}"><span>${String.fromCharCode(65 + idx)}. ${opt}</span></button>`;
            });

            const exp = document.getElementById('quiz-explanation');
            if (ans !== undefined) {
                exp.classList.remove('hidden');
                document.getElementById('quiz-explanation-text').innerText = q.explanation || "Không có giải thích chi tiết.";
                document.getElementById('btn-next-quiz').classList.toggle('hidden', currentQuizIndex >= window.arcadeData.quiz.length - 1);
            } else {
                exp.classList.add('hidden');
                document.getElementById('btn-next-quiz').classList.add('hidden');
            }
        }

        function handleTimeOut() {
            selectedAnswersMap[currentQuizIndex] = -1;
            const wrapper = document.getElementById('game-card-wrapper');
            wrapper.classList.add('animate-shake');
            setTimeout(() => wrapper.classList.remove('animate-shake'), 300);
            renderArcadeQuiz();
        }

        function selectArcadeAnswer(idx) {
            clearInterval(arcadeTimer);
            const q = window.arcadeData.quiz[currentQuizIndex];
            selectedAnswersMap[currentQuizIndex] = idx;
            if (idx === q.correct) {
                quizScore += 10;
                userXP += 10;
                updateXPDisplay();
            } else {
                const wrapper = document.getElementById('game-card-wrapper');
                wrapper.classList.add('animate-shake');
                setTimeout(() => wrapper.classList.remove('animate-shake'), 300);
            }
            renderArcadeQuiz();
        }

        function startChapter(chapterId, mode) {
            isArcadeMode = false;
            currentChapterId = chapterId;
            currentCardIndex = 0; currentQuizIndex = 0; quizScore = 0; selectedAnswersMap = {};
            document.getElementById('study-title').innerText = laborLawData.find(c => c.id === chapterId).title;
            document.getElementById('study-mode-buttons').classList.remove('hidden');
            document.getElementById('timer-box').classList.add('hidden');
            switchTab('study');
            setStudyMode(mode);
        }

        function setStudyMode(mode) {
            currentStudyMode = mode;
            document.getElementById('flashcard-container').classList.toggle('hidden', mode !== 'flashcard');
            document.getElementById('quiz-container').classList.toggle('hidden', mode !== 'quiz');
            document.getElementById('btn-mode-fc').className = `px-3 py-1.5 rounded-xl text-sm font-semibold ${mode === 'flashcard' ? 'bg-red-600 text-white' : 'bg-slate-700'}`;
            document.getElementById('btn-mode-qz').className = `px-3 py-1.5 rounded-xl text-sm font-semibold ${mode === 'quiz' ? 'bg-red-600 text-white' : 'bg-slate-700'}`;
            mode === 'flashcard' ? renderFlashcard() : renderQuiz();
        }

        function renderFlashcard() {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            if(!chapter || !chapter.cards || !chapter.cards[currentCardIndex]) return;
            const card = chapter.cards[currentCardIndex];
            document.getElementById('fc-index').innerText = `Thẻ ${currentCardIndex + 1}/${chapter.cards.length}`;
            document.getElementById('fc-front').innerText = card.q;
            document.getElementById('fc-back').innerText = card.a;
            document.getElementById('card-inner').classList.remove('rotate-y-180');
            updateSaveButton(card.q);
        }

        function flipCard() { document.getElementById('card-inner').classList.toggle('rotate-y-180'); }
        function nextCard() { const ch = laborLawData.find(c => c.id === currentChapterId); currentCardIndex = (currentCardIndex + 1) % ch.cards.length; renderFlashcard(); }
        function prevCard() { const ch = laborLawData.find(c => c.id === currentChapterId); currentCardIndex = (currentCardIndex - 1 + ch.cards.length) % ch.cards.length; renderFlashcard(); }

        function renderQuiz() {
            if(isArcadeMode) { renderArcadeQuiz(); return; }
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            if(!chapter || !chapter.quiz || !chapter.quiz[currentQuizIndex]) return;
            const q = chapter.quiz[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `Câu ${currentQuizIndex + 1}/${chapter.quiz.length}`;
            document.getElementById('quiz-score').innerText = `Điểm: ${quizScore}`;
            document.getElementById('quiz-question').innerText = q.q;
            
            const optionsEl = document.getElementById('quiz-options');
            optionsEl.innerHTML = '';
            const ans = selectedAnswersMap[currentQuizIndex];

            q.options.forEach((opt, idx) => {
                let btnClass = "w-full text-left p-3.5 rounded-xl border border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-sm transition";
                if (ans !== undefined) {
                    if (idx === q.correct) btnClass = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-950/60 text-green-300 text-sm";
                    else if (idx === ans) btnClass = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-950/60 text-red-300 text-sm";
                }
                optionsEl.innerHTML += `<button onclick="selectAnswer(${idx})" ${ans !== undefined ? 'disabled' : ''} class="${btnClass}"><span>${String.fromCharCode(65 + idx)}. ${opt}</span></button>`;
            });

            const exp = document.getElementById('quiz-explanation');
            if (ans !== undefined) {
                exp.classList.remove('hidden');
                document.getElementById('quiz-explanation-text').innerText = q.explanation || "Không có giải thích chi tiết.";
                document.getElementById('btn-next-quiz').classList.toggle('hidden', currentQuizIndex >= chapter.quiz.length - 1);
            } else {
                exp.classList.add('hidden');
                document.getElementById('btn-next-quiz').classList.add('hidden');
            }
        }

        function selectAnswer(idx) {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            const q = chapter.quiz[currentQuizIndex];
            selectedAnswersMap[currentQuizIndex] = idx;
            if (idx === q.correct) {
                quizScore += 10;
                userXP += 5;
                updateXPDisplay();
                setTimeout(nextQuiz, 1000);
            } else {
                addWrongItem({ chapter: chapter.title, q: q.q, explanation: q.explanation });
                const wrapper = document.getElementById('game-card-wrapper');
                wrapper.classList.add('animate-shake');
                setTimeout(() => wrapper.classList.remove('animate-shake'), 300);
            }
            renderQuiz();
        }

        function nextQuiz() { 
            if(isArcadeMode) {
                if (currentQuizIndex < window.arcadeData.quiz.length - 1) { currentQuizIndex++; renderArcadeQuiz(); }
                return;
            }
            const ch = laborLawData.find(c => c.id === currentChapterId); 
            if (currentQuizIndex < ch.quiz.length - 1) { currentQuizIndex++; renderQuiz(); } 
        }

        function prevQuiz() { 
            if(isArcadeMode) {
                if (currentQuizIndex > 0) { currentQuizIndex--; renderArcadeQuiz(); }
                return;
            }
            if (currentQuizIndex > 0) { currentQuizIndex--; renderQuiz(); } 
        }

        function toggleSaveCurrentCard() {
            const chapter = laborLawData.find(c => c.id === currentChapterId);
            const card = chapter.cards[currentCardIndex];
            const index = savedItems.findIndex(i => i.q === card.q);
            if (index > -1) savedItems.splice(index, 1);
            else savedItems.push({ chapter: chapter.title, q: card.q, a: card.a });
            localStorage.setItem('labor_law_saved', JSON.stringify(savedItems));
            updateCounts(); updateSaveButton(card.q);
        }

        function updateSaveButton(qText) {
            const isSaved = savedItems.some(i => i.q === qText);
            document.getElementById('star-icon-fc').className = isSaved ? "fa-solid fa-star text-amber-400" : "fa-regular fa-star";
        }

        function addWrongItem(obj) {
            if (!wrongItems.some(i => i.q === obj.q)) {
                wrongItems.push(obj);
                localStorage.setItem('labor_law_wrong', JSON.stringify(wrongItems));
                updateCounts();
            }
        }

        function updateCounts() {
            document.getElementById('count-saved').innerText = savedItems.length;
            document.getElementById('count-wrong').innerText = wrongItems.length;
        }

        function openSavedList() {
            switchTab('list'); document.getElementById('list-view-title').innerText = "Thẻ Đã Lưu";
            document.getElementById('list-container').innerHTML = savedItems.map(i => `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="text-xs text-amber-400">${i.chapter}</div><h5 class="font-bold">${i.q}</h5><p class="text-sm mt-2 text-slate-300">${i.a}</p></div>`).join('') || '<p class="text-slate-500">Chưa có thẻ nào được lưu</p>';
        }

        function openWrongList() {
            switchTab('list'); document.getElementById('list-view-title': "Danh Sách Câu Hay Sai";
            document.getElementById('list-container').innerHTML = wrongItems.map(i => `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="text-xs text-rose-400">${i.chapter}</div><h5 class="font-bold">${i.q}</h5><p class="text-sm mt-2 text-slate-300">Giải thích: ${i.explanation}</p></div>`).join('') || '<p class="text-slate-500">Chưa có câu sai nào</p>';
        }
    </script>
</body>
</html>
